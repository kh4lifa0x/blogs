<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-gradient { fill: url(#bgGradient); }
      .title-text { font-family: 'Arial', sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .subtitle-text { font-family: 'Arial', sans-serif; fill: #e0e0e0; text-anchor: middle; }
      .brand-text { font-family: 'Arial', sans-serif; font-weight: bold; fill: #00ff88; text-anchor: end; }
      .data-line { stroke: #ff6b6b; stroke-width: 2; fill: none; opacity: 0.8; }
      .data-point { fill: #ff6b6b; opacity: 0.9; }
      .lock-icon { fill: #ffdd44; opacity: 0.7; }
      .warning-icon { fill: #ff6b6b; opacity: 0.8; }
      .code-text { font-family: 'Courier New', monospace; fill: #00ff88; font-size: 12px; opacity: 0.6; }
      .cyber-element { fill: none; stroke: #00ff88; stroke-width: 1; opacity: 0.4; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Circuit pattern -->
    <pattern id="circuit" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="none"/>
      <path d="M10,10 L30,10 L30,30 L50,30 L50,10 L70,10 L70,30 L90,30" stroke="#00ff88" stroke-width="0.5" opacity="0.2" fill="none"/>
      <path d="M10,50 L30,50 L30,70 L50,70 L50,50 L70,50 L70,70 L90,70" stroke="#00ff88" stroke-width="0.5" opacity="0.2" fill="none"/>
      <circle cx="30" cy="30" r="2" fill="#00ff88" opacity="0.3"/>
      <circle cx="70" cy="70" r="2" fill="#00ff88" opacity="0.3"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Animation for pulse effect -->
    <animate id="pulseAnim" attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" class="bg-gradient"/>
  <rect width="1200" height="600" fill="url(#circuit)"/>
  
  <!-- Dark overlay for text readability -->
  <rect x="0" y="0" width="1200" height="600" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Cyber grid background -->
  <g opacity="0.1">
    <defs>
      <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00ff88" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1200" height="600" fill="url(#grid)"/>
  </g>
  
  <!-- Data theft visualization -->
  <g opacity="0.6">
    <!-- Data streams -->
    <path d="M100,200 Q200,150 300,200 Q400,250 500,200 Q600,150 700,200" class="data-line">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M100,300 Q200,250 300,300 Q400,350 500,300 Q600,250 700,300" class="data-line">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M100,400 Q200,350 300,400 Q400,450 500,400 Q600,350 700,400" class="data-line">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Laptop/Computer icon -->
  <g transform="translate(900, 150)">
    <rect x="0" y="40" width="120" height="80" rx="5" fill="#333" stroke="#555" stroke-width="2"/>
    <rect x="10" y="50" width="100" height="60" fill="#000"/>
    <rect x="15" y="55" width="90" height="50" fill="#1a1a2e"/>
    <rect x="-10" y="120" width="140" height="10" rx="5" fill="#333"/>
    <!-- Screen glow -->
    <rect x="15" y="55" width="90" height="50" fill="rgba(0,255,136,0.1)"/>
    
    <!-- Warning symbols on screen -->
    <g transform="translate(40, 70)">
      <polygon points="20,5 35,30 5,30" class="warning-icon"/>
      <text x="20" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">!</text>
    </g>
  </g>
  
  <!-- Lock icons (being broken) -->
  <g transform="translate(150, 250)">
    <rect x="0" y="15" width="25" height="20" rx="3" fill="#333" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M5,15 Q5,5 12.5,5 Q20,5 20,15" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
    <line x1="12.5" y1="20" x2="12.5" y2="30" stroke="#ff6b6b" stroke-width="2"/>
    <!-- Crack effect -->
    <path d="M12.5,5 L12.5,35" stroke="#ff6b6b" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Key/credential icons -->
  <g transform="translate(250, 350)">
    <rect x="0" y="10" width="15" height="8" rx="2" fill="#ffdd44" opacity="0.7"/>
    <rect x="15" y="12" width="20" height="4" fill="#ffdd44" opacity="0.7"/>
    <rect x="30" y="14" width="3" height="3" fill="#ffdd44" opacity="0.7"/>
    <rect x="30" y="11" width="3" height="3" fill="#ffdd44" opacity="0.7"/>
    
    <!-- Floating away effect -->
    <animateTransform attributeName="transform" type="translate" values="250,350; 280,320; 310,290" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0" dur="4s" repeatCount="indefinite"/>
  </g>
  
  <!-- Code/malware visualization -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" class="code-text">&lt;script&gt; steal_data() &lt;/script&gt;</text>
    <text x="0" y="20" class="code-text">GET /credentials HTTP/1.1</text>
    <text x="0" y="40" class="code-text">POST /exfiltrate-data</text>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="200" class="title-text" font-size="64" filter="url(#glow)">
    INFOSTEALERS
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="240" class="title-text" font-size="32">
    101
  </text>
  
  <!-- Subheading -->
  <text x="600" y="280" class="subtitle-text" font-size="18">
    Understanding the Modern Cyber Threat Landscape
  </text>
  
  <!-- Divider line -->
  <line x1="400" y1="320" x2="800" y2="320" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  
  <!-- Additional subtitle -->
  <text x="600" y="350" class="subtitle-text" font-size="14">
    From Initial Infection to Data Exfiltration
  </text>
  
  <!-- DarkAtlas.io branding -->
  <text x="1150" y="550" class="brand-text" font-size="16">
    DarkAtlas.io
  </text>
  
  <!-- Tech accent elements -->
  <g opacity="0.3">
    <!-- Hexagon tech elements -->
    <polygon points="50,100 70,90 90,100 90,120 70,130 50,120" class="cyber-element"/>
    <polygon points="1100,450 1120,440 1140,450 1140,470 1120,480 1100,470" class="cyber-element"/>
    
    <!-- Circuit lines -->
    <path d="M0,50 L50,50 L50,100 L100,100" class="cyber-element"/>
    <path d="M1100,500 L1150,500 L1150,550 L1200,550" class="cyber-element"/>
    
    <!-- Data nodes -->
    <circle cx="75" cy="75" r="3" fill="#00ff88" opacity="0.4">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1125" cy="475" r="3" fill="#ff6b6b" opacity="0.4">
      <animate attributeName="r" values="3;6;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="200" cy="100" r="2" fill="#00ff88">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,-30; 100,-60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="450" r="2" fill="#ff6b6b">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,-30; -100,-60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Scanlines effect -->
  <g opacity="0.1">
    <rect x="0" y="0" width="1200" height="2" fill="#00ff88">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,600; 0,0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>